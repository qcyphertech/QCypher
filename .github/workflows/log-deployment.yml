name: Log deployment

# Fixes a real gap found 2026-08-16: scripts/log-deployment.sh exists
# but has never once been run — deployment_log has zero rows despite
# dozens of real production deploys (confirmed via `vercel ls`).
# Root cause: the script assumes a manual "build, then vercel --prod"
# step to attach itself to, but production deploys here are actually
# triggered automatically by Vercel's GitHub integration on every push
# to main — there's no manual step for a human to remember to pair
# the logging script with. This workflow removes that human-memory
# dependency entirely by logging every push to main on its own.

on:
  push:
    branches: [main]

jobs:
  log-deployment:
    name: Record deployment_log entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log this push to deployment_log
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          COMMIT_HASH="${{ github.sha }}"
          COMMIT_MESSAGE=$(git log -1 --pretty=%s "$COMMIT_HASH")
          DEPLOYED_BY="${{ github.event.head_commit.author.name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(python3 - "$DEPLOYED_BY" "$COMMIT_HASH" "$COMMIT_MESSAGE" "$RUN_URL" <<'PYEOF'
          import json, sys
          deployed_by, commit_hash, commit_message, run_url = sys.argv[1:5]
          print(json.dumps({
              "deployed_by": deployed_by,
              "commit_hash": commit_hash,
              "commit_message": commit_message,
              "notes": f"Auto-logged by GitHub Actions on push to main. CI run: {run_url}",
          }))
          PYEOF
          )

          curl -sS -f -X POST "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/deployment_log" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "$PAYLOAD"
