name: Deploy to production

# Fixes a real gap found 2026-08-16: this Vercel project's native GitHub
# integration link is stale (still labeled org: nevis09 internally, from
# before the repo moved to the qcyphertech GitHub org on 2026-08-10) and
# has not triggered a single automatic deploy since then — every one of
# the 190+ commits in that window (confirmed via the Vercel API's
# deployment history, all showing source: "cli") only reached production
# because a human or an agent manually ran `vercel --prod`. Nobody did
# that consistently, so production drifted ~9 days behind main before
# this was caught.
#
# This restores real automatic deployment without depending on fixing
# that native integration (which needs an interactive OAuth reconnect):
# a Vercel Deploy Hook, confirmed via a real test to correctly pull the
# current commit from the qcyphertech/QCypher repo, triggered here.
#
# Gated on CI as of 2026-08-25 — a second real gap: this used to trigger
# directly on push, independent of the CI workflow, so a commit that
# failed `tsc --noEmit` in CI (confirmed happened for real on commit
# 29c6187 — Record<string, unknown> not assignable to Json) still
# deployed, because the deploy hook doesn't care whether CI passed. Now
# triggered by CI's own completion instead of push, and only proceeds
# if CI's conclusion was "success".
#
# Third real gap, found 2026-08-18: a successful curl to the deploy hook
# only means Vercel *accepted the request* — not that the build finished
# or actually got promoted to www.qcyphertech.com. A commit's deploy
# silently produced no new production deployment at all while this step
# still showed green, leaving the live site on a stale build with no
# error anywhere. Now polls the Vercel API after triggering the hook
# until a deployment matching this exact commit reaches READY, and fails
# the job (loudly, in CI) if that doesn't happen within the timeout.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Trigger Vercel production deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Trigger deploy hook
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"state"' || (echo "Deploy hook did not return a job state" && exit 1)

      - name: Wait for this commit to actually go READY in production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Waiting for commit $SHA to reach READY on production..."
          for i in $(seq 1 30); do
            RESPONSE=$(curl -sS "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&limit=10" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}")

            STATE=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          sha = '$SHA'
          for d in data.get('deployments', []):
              meta = d.get('meta', {})
              if meta.get('githubCommitSha') == sha:
                  print(d.get('readyState', 'UNKNOWN'))
                  break
          else:
              print('NOT_FOUND')
          ")

            echo "Attempt $i/30: readyState=$STATE"

            if [ "$STATE" = "READY" ]; then
              echo "Deployment is live."
              exit 0
            fi

            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "Deployment for $SHA failed with state $STATE."
              exit 1
            fi

            sleep 10
          done

          echo "Timed out after 5 minutes waiting for $SHA to reach READY. Production may still be on a stale build — check Vercel directly."
          exit 1
