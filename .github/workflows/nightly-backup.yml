name: Nightly backup + verify

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC every night
  workflow_dispatch:        # allow manual trigger

jobs:
  backup:
    name: pg_dump → R2 → verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable Postgres 17 for restore verification — matches Supabase's
    # server version, torn down after the job. No extension dependency to
    # worry about: confirmed via a real pg_dump that this schema only uses
    # built-in functions (gen_random_uuid, now, nextval), nothing from
    # Supabase's extensions schema, since the dump is --schema=public only.
    # Deliberately not a second persistent Supabase project — that would
    # be an ongoing cost and another thing to maintain for a check that
    # only needs to exist for the few minutes this job runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Ubuntu's default postgresql-client package trails Supabase's actual
      # Postgres version (confirmed: Ubuntu noble ships v16, Supabase runs
      # 17.6) — pg_dump refuses to run against a newer server than itself.
      # Install from the official PGDG apt repo instead, pinned to 17, so
      # the client always matches or exceeds Supabase's major version.
      # Confirmed by testing: even after installing postgresql-client-17,
      # the plain `pg_dump` on PATH still resolved to a pre-existing 16.14
      # that ships baked into the ubuntu-24.04 runner image ahead of the
      # apt-installed one — update-alternatives doesn't manage it.
      # Prepending the versioned binary dir to $GITHUB_PATH forces every
      # later step in this job to see 17's pg_dump first.
      - name: Install pg_dump (PostgreSQL 17, matches Supabase)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify pg_dump version
        run: pg_dump --version

      - name: Install AWS CLI (for R2)
        run: |
          pip install --quiet awscli

      - name: Run backup + verify
        env:
          SUPABASE_DB_URL:        ${{ secrets.SUPABASE_DB_URL }}
          R2_BUCKET:              ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT:            ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:       ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:   ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Local-only service container, not a secret — the password is
          # a throwaway default for a container that exists for the
          # duration of this job and is never reachable outside it.
          RESTORE_DB_URL:         postgresql://postgres:postgres@localhost:5432/postgres
        run: bash scripts/backup-verify.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Nightly backup failed — check Supabase DB URL and R2 credentials"
