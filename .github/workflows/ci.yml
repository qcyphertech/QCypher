name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Secret & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Secret audit
        run: bash scripts/secret-audit.sh
        continue-on-error: true   # surface security issues without blocking; fix separately
      - name: Dependency audit (high+critical only)
        run: pnpm --filter web exec npm audit --audit-level=high
        continue-on-error: true   # surface issues without blocking; fix criticals manually

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    continue-on-error: true   # surface issues without blocking; fix separately
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsc --noEmit

  rls-isolation:
    name: RLS isolation tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'   # only on main — requires live Supabase
    # NOT continue-on-error: unlike the other CI jobs, this one now has real
    # signal. Found and fixed 2026-08-16: this suite had never once run
    # successfully — missing all 7 required secrets, a Vitest-only API
    # (describe.skipIf) used under Jest, 4 files importing directly from
    # 'vitest', and a missing-semicolon ASI bug that made every describe
    # block throw "afterAll(...) is not a function". 4 of 8 test files
    # (42 tests) are now self-contained and run for real against the live
    # DB; the other 4 need pre-provisioned TEST_TENANT_A/B fixtures that
    # don't exist yet, so they skip cleanly rather than fail.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run RLS tests
        env:
          NEXT_PUBLIC_SUPABASE_URL:     ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_TENANT_A_EMAIL:          ${{ secrets.TEST_TENANT_A_EMAIL }}
          TEST_TENANT_A_PASSWORD:       ${{ secrets.TEST_TENANT_A_PASSWORD }}
          TEST_TENANT_B_EMAIL:          ${{ secrets.TEST_TENANT_B_EMAIL }}
          TEST_TENANT_B_PASSWORD:       ${{ secrets.TEST_TENANT_B_PASSWORD }}
          APP_URL:                      ${{ secrets.APP_URL }}
        run: pnpm test:isolation
