name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Secret & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Secret audit
        run: bash scripts/secret-audit.sh
        continue-on-error: true   # surface security issues without blocking; fix separately
      - name: Dependency audit (high+critical only)
        run: pnpm --filter web exec npm audit --audit-level=high
        continue-on-error: true   # surface issues without blocking; fix criticals manually

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    continue-on-error: true   # surface issues without blocking; fix separately
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsc --noEmit

  rls-isolation:
    name: RLS isolation tests
    runs-on: ubuntu-latest
    # Runs on both push-to-main and PRs targeting main (not just main) —
    # this repo has no branch protection requiring status checks, but
    # running pre-merge still surfaces a regression before it ships rather
    # than after. Uses the same repo secrets PRs already have access to
    # (this is a private single-team repo, no fork PRs to worry about).
    # NOT continue-on-error: unlike the other CI jobs, this one has real
    # signal. Found and fixed 2026-08-16: this suite had never once run
    # successfully — missing all 7 required secrets, a Vitest-only API
    # (describe.skipIf) used under Jest, 4 files importing directly from
    # 'vitest', a missing-semicolon ASI bug, getUserByEmail not existing in
    # the installed SDK, and a rate-limit from re-authenticating per-test.
    # All 8 files (91 tests) now run for real against real TEST_TENANT_A/B
    # fixtures and a live DB; 9 tests remain deliberately skipped (see
    # rls-final-sweep.test.ts / rls-regression-phase2.test.ts comments).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run RLS tests
        env:
          NEXT_PUBLIC_SUPABASE_URL:     ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_TENANT_A_EMAIL:          ${{ secrets.TEST_TENANT_A_EMAIL }}
          TEST_TENANT_A_PASSWORD:       ${{ secrets.TEST_TENANT_A_PASSWORD }}
          TEST_TENANT_B_EMAIL:          ${{ secrets.TEST_TENANT_B_EMAIL }}
          TEST_TENANT_B_PASSWORD:       ${{ secrets.TEST_TENANT_B_PASSWORD }}
          APP_URL:                      ${{ secrets.APP_URL }}
        run: pnpm test:isolation
